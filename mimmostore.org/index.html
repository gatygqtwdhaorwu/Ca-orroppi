<script>
// ============================================================
// MimmoStore FIX — يمنع Next.js من تدمير الصفحة
// ============================================================
(function() {
  'use strict';

  // 1. منع تحميل ملف Next.js المعطل
  function killBrokenScripts() {
    var scripts = document.querySelectorAll('script[src*="index-cSd6hS-P"]');
    scripts.forEach(function(s) { if (s.parentNode) s.parentNode.removeChild(s); });
    // مراقبة أي إضافة جديدة
    var obs = new MutationObserver(function(muts) {
      muts.forEach(function(m) {
        for (var i = 0; i < m.addedNodes.length; i++) {
          var n = m.addedNodes[i];
          if (n.tagName === 'SCRIPT' && n.src && n.src.indexOf('index-cSd6hS-P') !== -1) {
            if (n.parentNode) n.parentNode.removeChild(n);
          }
        }
      });
    });
    obs.observe(document.documentElement, { childList: true, subtree: true });
  }

  // 2. استخراج بيانات المنتجات من SSR
  function extractData() {
    try {
      if (window.$_TSR && $_TSR.d) return $_TSR.d;
      var scripts = document.querySelectorAll('script');
      for (var i = 0; i < scripts.length; i++) {
        var text = scripts[i].textContent || '';
        if (text.indexOf('$_TSR') !== -1) {
          // force-evaluate the TSR
          var fn = new Function(text + '; return $_TSR.d;');
          return fn();
        }
      }
    } catch(e) {}
    return null;
  }

  killBrokenScripts();

  // 3. حفظ محتوى root قبل ما React يمسحه
  var savedHTML = '';
  var root = document.getElementById('root');
  if (root) savedHTML = root.innerHTML;

  // 4. بعد تحميل الصفحة، إذا الـ React مسحت المحتوى، نرجعه
  setTimeout(function() {
    var root2 = document.getElementById('root');
    if (root2 && root2.innerHTML.trim() === '') {
      root2.innerHTML = savedHTML;
    }
  }, 2000);
})();
</script>
