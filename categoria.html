<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Categoria | MimmoStore</title>
<style>
:root{--primary:#a16207;--primary-dark:#854d0e;--primary-soft:rgba(161,98,7,.09);--border:#e7e0d3;--bg:#faf8f4;--card:#fff;--fg:#1c1917;--muted:#78716c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5}
img{display:block;max-width:100%}
a{color:var(--primary);text-decoration:none}
.container{max-width:1152px;margin:0 auto;padding:0 12px}
header{position:sticky;top:0;z-index:50;background:rgba(250,248,244,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;gap:10px;height:56px}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--primary);font-size:13px;font-weight:600;white-space:nowrap}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;height:36px;border-radius:999px;border:1px solid var(--border);background:#f1eee7;padding:0 12px 0 34px;font-size:13px;outline:none}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#a8a29e;width:15px;height:15px;pointer-events:none}
.wa-btn{flex-shrink:0;display:flex;align-items:center;gap:6px;border:1px solid rgba(161,98,7,.5);color:var(--primary);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.cat-head{padding:20px 0 4px}
.cat-head h1{font-size:20px}
.cat-head p{font-size:12px;color:var(--muted)}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 0 20px}
@media(min-width:640px){.product-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.product-grid{grid-template-columns:repeat(4,1fr)}}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.product-card img{aspect-ratio:1/1;object-fit:cover;width:100%}
.product-body{padding:10px}
.product-body .brand{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--primary);font-weight:800}
.product-body h3{font-size:12px;font-weight:700;line-height:1.35;margin-top:2px}
.product-body .size{font-size:11px;color:var(--muted);margin-top:4px}
#noResults{display:none;text-align:center;color:var(--muted);font-size:13px;padding:30px 0}
.empty{text-align:center;padding:50px 0;color:var(--muted)}
.empty h2{color:var(--fg);margin-bottom:6px}
.btn-outline{display:inline-block;border:1px solid var(--primary);color:var(--primary);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;margin-top:12px}
footer{border-top:1px solid var(--border);text-align:center;padding:24px 12px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<header>
<div class="container header-inner">
<a class="back-btn" href="index.html">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="m15 18-6-6 6-6"/></svg>
Catalogo</a>
<div class="search">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/></svg>
<input id="searchInput" placeholder="Cerca in questa categoria…" oninput="doFilter(this.value)"/>
</div>
<a class="wa-btn" href="https://wa.me/393510570879" target="_blank" rel="noopener">WhatsApp</a>
</div>
</header>

<main class="container">
<div class="cat-head">
<h1 id="catTitle">Categoria</h1>
<p id="catCount"></p>
</div>
<div id="noResults">Nessun prodotto trovato. Prova con un altro termine.</div>
<div class="product-grid" id="productGrid"></div>
</main>

<footer>MimmoStore — W86C+H3R, El-Salam, Sharm El Sheikh, Egitto<br/>Ordina su WhatsApp: +39 351 057 0879</footer>

<script src="api.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var tag = params.get('tag') || '';
  var current = MimmoApp.byTag(tag);

  document.getElementById('catTitle').textContent = tag ? decodeURIComponent(tag) : 'Tutti i prodotti';
  document.title = (tag ? decodeURIComponent(tag) : 'Catalogo') + ' | MimmoStore';
  document.getElementById('catCount').textContent = current.length + ' prodotti';

  MimmoApp.renderProducts(current, 'productGrid');

  window.doFilter = function (qv) {
    var t = qv.toLowerCase().trim();
    MimmoApp.renderProducts(t ? current.filter(function (p) {
      return p.name.toLowerCase().includes(t) || p.brand.toLowerCase().includes(t) || p.tags.join(' ').toLowerCase().includes(t);
    }) : current, 'productGrid');
  };

  if (!current.length) {
    document.getElementById('productGrid').innerHTML =
      '<div class="empty" style="grid-column:1/-1"><h2>Nessun prodotto in questa categoria</h2>' +
      '<p>Scrivici su WhatsApp per ordinare o chiedere il catalogo completo.</p>' +
      '<a class="btn-outline" href="index.html">← Torna al catalogo</a></div>';
  }
})();
</script>
</body>
</html>
