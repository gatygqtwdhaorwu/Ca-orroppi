<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Prodotto | MimmoStore</title>
<style>
:root{--primary:#a16207;--primary-dark:#854d0e;--primary-soft:rgba(161,98,7,.09);--border:#e7e0d3;--bg:#faf8f4;--card:#fff;--fg:#1c1917;--muted:#78716c;--gold-glow:0 0 24px rgba(201,162,39,.35)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5}
img{display:block;max-width:100%}
a{color:var(--primary);text-decoration:none}
.container{max-width:1152px;margin:0 auto;padding:0 12px}
header{position:sticky;top:0;z-index:50;background:rgba(250,248,244,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;gap:10px;height:56px}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--primary);font-size:13px;font-weight:600;white-space:nowrap}
.back-btn svg{width:16px;height:16px}
.spacer{flex:1}
.wa-btn{display:flex;align-items:center;gap:6px;border:1px solid rgba(161,98,7,.5);color:var(--primary);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.btn-primary{display:block;text-align:center;background:var(--primary);color:#fff!important;border-radius:10px;padding:12px;font-size:14px;font-weight:700;border:0;cursor:pointer;width:100%}
.btn-outline{display:block;text-align:center;border:1px solid var(--primary);color:var(--primary);border-radius:10px;padding:10px;font-size:13px;font-weight:700;margin-top:8px}
section{padding:16px 0}
.not-found{text-align:center;padding:60px 0;color:var(--muted)}
.not-found h2{color:var(--fg);margin-bottom:8px}
/* تفاصيل المنتج */
.detail-grid{display:grid;gap:18px}
@media(min-width:768px){.detail-grid{grid-template-columns:1.1fr 1fr}}
.gallery{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px;position:sticky;top:70px}
.gallery img.main{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:2px solid var(--border);cursor:pointer;flex-shrink:0}
.thumbs img.active{border-color:var(--primary)}
.info{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.info .brand{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--primary);font-weight:800}
.info h1{font-size:20px;margin:4px 0 2px}
.info .meta{font-size:13px;color:var(--muted)}
.taglie{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.taglie span{border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;background:#f5f2eb}
.taglie span.sel{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:700}
.desc{font-size:13px;color:var(--muted);border-top:1px solid var(--border);padding-top:12px;margin-top:12px;white-space:pre-line}
.warn{border:2px solid var(--primary);background:var(--primary-soft);border-radius:12px;padding:12px;font-size:12px;color:var(--primary);font-weight:700;margin-top:12px;text-align:center}
.ship-note{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
/* منتجات مشابهة */
.related{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.related{grid-template-columns:repeat(4,1fr)}}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.product-card img{aspect-ratio:1/1;object-fit:cover;width:100%}
.product-body{padding:10px}
.product-body .brand{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--primary);font-weight:800}
.product-body h3{font-size:12px;font-weight:700;line-height:1.35;margin-top:2px}
.product-body .size{font-size:11px;color:var(--muted);margin-top:4px}
footer{border-top:1px solid var(--border);text-align:center;padding:24px 12px;margin-top:24px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<header>
<div class="container header-inner">
<a class="back-btn" href="index.html">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
Torna al catalogo</a>
<span class="spacer"></span>
<a class="wa-btn" href="https://wa.me/393510570879" target="_blank" rel="noopener">WhatsApp</a>
</div>
</header>

<main class="container" id="detail"></main>

<section class="container">
<h2 style="font-size:16px;font-weight:700;margin-bottom:10px">Ti potrebbe interessare</h2>
<div class="related" id="related"></div>
</section>

<footer>MimmoStore — W86C+H3R, El-Salam, Sharm El Sheikh, Egitto<br/>Ordina su WhatsApp: +39 351 057 0879</footer>

<script src="api.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  var p = MimmoApp.getProduct(id);
  var root = document.getElementById('detail');

  if (!p) {
    root.innerHTML = '<div class="not-found"><h2>Prodotto non trovato ❌</h2><p>Il prodotto potrebbe essere stato rimosso.</p><a class="btn-outline" href="index.html" style="display:inline-block;margin-top:12px">← Torna al catalogo</a></div>';
    return;
  }

  document.title = p.brand + ' ' + p.name + ' | MimmoStore';

  var selTaglia = p.sizes.split('-').length === 2
    ? (function () {
        var out = [], a = parseInt(p.sizes.split('-')[0], 10), b = parseInt(p.sizes.split('-')[1], 10);
        for (var i = a; i <= b; i++) out.push(i);
        return out;
      })()
    : [p.sizes];

  var taglieHtml = selTaglia.map(function (s) {
    return '<span data-t="' + s + '" onclick="selTaglia(this)">' + s + '</span>';
  }).join('');

  var imgHtml = (p.images && p.images.length ? p.images : [p.img]).map(function (u, i) {
    return '<img src="' + u + '" alt="' + MimmoApp.esc(p.name) + '" class="' + (i === 0 ? 'active' : '') + '" onclick="changeImg(this)"/>';
  }).join('');

  root.innerHTML =
    '<div class="detail-grid">' +
      '<div class="gallery">' +
        '<img class="main" id="galleryMain" src="' + p.images[0] + '" alt="' + MimmoApp.esc(p.name) + '" onerror="this.src=\'' + p.img + '\'"/>' +
        '<div class="thumbs">' + imgHtml + '</div>' +
      '</div>' +
      '<div class="info">' +
        '<span class="brand">' + MimmoApp.esc(p.brand) + '</span>' +
        '<h1>' + MimmoApp.esc(p.name) + '</h1>' +
        '<p class="meta">📁 Categoria: ' + MimmoApp.esc(p.tags.join(', ')) + '</p>' +
        '<div class="taglie">' + taglieHtml + '</div>' +
        '<p class="desc">' + MimmoApp.esc(p.desc) + '\n\n💰 Prezzo: su WhatsApp\n🚚 Spedizione DHL tracciata in tutto il mondo</p>' +
        '<button class="btn-primary" id="orderBtn">🛒 Ordina su WhatsApp</button>' +
        '<a class="btn-outline" href="#come-funziona">ℹ️ Come funziona</a>' +
        '<div class="warn">⚠️ +39 351 057 0879 è l\'UNICO numero ufficiale di MimmoStore.</div>' +
        '<p class="ship-note">🕗 Rispondiamo 08:00-12:00 e 17:00-00:00</p>' +
      '</div>' +
    '</div>';

  window.selTaglia = function (el) {
    document.querySelectorAll('.taglie span').forEach(function (s) { s.classList.remove('sel'); });
    el.classList.add('sel');
  };

  window.changeImg = function (el) {
    document.getElementById('galleryMain').src = el.src;
    document.querySelectorAll('.thumbs img').forEach(function (t) { t.classList.remove('active'); });
    el.classList.add('active');
  };

  document.getElementById('orderBtn').addEventListener('click', function () {
    var sel = document.querySelector('.taglie span.sel');
    var taglia = sel ? sel.getAttribute('data-t') : p.sizes;
    var msg = 'Ciao MimmoStore! Sono interessato a: ' + p.brand + ' ' + p.name + ' (taglia ' + taglia + ').';
    window.open(MimmoApp.waLink(msg), '_blank');
  });

  /* منتجات مشابهة (من نفس الفئة) */
  var rel = MimmoApp.products.filter(function (x) {
    return x.id !== p.id && x.tags.some(function (t) { return p.tags.indexOf(t) !== -1; });
  }).slice(0, 4);
  if (rel.length < 4) {
    rel = rel.concat(MimmoApp.products.filter(function (x) { return x.id !== p.id && rel.indexOf(x) === -1; }).slice(0, 4 - rel.length));
  }
  document.getElementById('related').innerHTML = rel.map(MimmoApp.card).join('');
})();
</script>
</body>
</html>
